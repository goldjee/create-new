name: Build DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15 # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and package
        run: ./build.sh --test --dmg
      - uses: actions/upload-artifact@v4
        with:
          name: CreateNew-dmg
          path: build/CreateNew.dmg
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/CreateNew.dmg --generate-notes
